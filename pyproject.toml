[build-system]
requires = [
    "setuptools>=61.2",
    "wheel",
    "setuptools_scm>=6.2"
]
build-backend = "setuptools.build_meta"

[project]
name = "nettle"

# Where is version coming from?
#dynamic = ['version']
version = "0.4.4"

requires-python = ">=3.10"
authors = [
    { name = "Alisson Pinto", email = "alisson.pinto@clevertech.biz" },
    { name = "Kiran Morrison", email = "kiran@arbol.io" }
]
keywords = ['Climate', 'ETL', 'IPFS', 'S3']
description = "Tools for writing climate data etls using S3 or IPFS as a backing store"

# The contents of the README file(s) are used to populate the Description field of your distribution’s metadata
# (similar to long_description in setuptools). When multiple files are specified they are concatenated with newlines.
# https://python-poetry.org/docs/pyproject/#readme
# long-description = 'A set of utilities for building ETLs of 2D data. Designed with climate data in mind, typically station based, and with storage on both s3 and IPFS available.'
readme = "README.md"

# Obsolete - only relevant for pkg_resources, easy_install and setup.py install in the context of eggs (deprecated).
# Was giving error: configuration error: `project` must not contain {'zip-safe'} properties
#zip-safe = true

# By default, include-package-data is true in pyproject.toml, so you do
# NOT have to specify this line.
# include-package-data = true

dependencies = [
    "geopandas",
    "numpy",
    "pandas",
    "pyarrow",
    "python-dotenv",
    "python-dateutil",
    "requests",
    "urllib3",
    "dag_cbor",
    "s3fs",
    "shapely",
    "cerberus",
    "coverage",
    "astropy"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Atmospheric Science"
]

#[tool.setuptools]
#packages=['nettle', 'nettle.utils', 'nettle.errors', 'nettle.io', 'nettle.metadata', 'nettle.dataframe']

[dependency-groups]
# Kept in its own group so CI's lint and format jobs can install ruff alone
# (`uv run --only-group lint`) instead of the whole dependency tree.
#
# Bounded below 0.17 on purpose. Ruff is pre-1.0 and its formatter output can
# change between minor releases, so an unbounded requirement lets a resolution
# pick up a ruff that reformats the whole tree. Unlike the sibling repositories
# this one has no uv.lock, so this bound is the only thing pinning the version.
lint = ["ruff>=0.16.1,<0.17"]

[tool.ruff]
line-length = 120
# Ruff honours .gitignore, so build artefacts and caches need no entry here.
# .claude/worktrees holds throwaway checkouts of this repo, which would otherwise
# be linted twice.
#
# Markdown is excluded because `ruff format` reformats fenced python blocks, and
# prose tends to illustrate calls with argument fragments rather than complete
# modules. Ruff reparses a fragment's trailing comma as a tuple and rewrites it,
# turning correct documentation into incorrect code.
extend-exclude = [".claude/worktrees", "*.md"]

[tool.ruff.lint]
# E = pycodestyle errors, F = pyflakes, I = isort. More rulesets to follow.
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Fixture data: long prose descriptions inside metadata and data dictionaries.
# Wrapping them would only make the fixtures harder to read against the real
# payloads they mirror.
"nettle_tests/fixtures/*.py" = ["E501"]
# Expected log lines asserted verbatim, plus long commented-out assertions. The
# expected strings have to match what the code emits, character for character.
"nettle_tests/io_tests/test_stores.py" = ["E501"]
"nettle_tests/station_set/test_transform_methods.py" = ["E501"]

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "no-local-version"
write_to = "nettle/_version.py"

[project.urls]
"Homepage" = "https://arbol.io/"
"Bug Tracker" = "https://github.com/Arbol-Project/nettle/issues"

[tool.setuptools.package-data]
"*" = ["*.txt"]

[tool.setuptools.packages.find]
exclude = ["docs*", "examples*"]
